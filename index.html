    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      (function () {
        var w = window.screen && window.screen.width || 0;
        var h = window.screen && window.screen.height || 0;
        var shortSide = Math.min(w, h);
        var ua = navigator.userAgent || '';
        var touch = navigator.maxTouchPoints > 1;
        var phone = /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (shortSide > 0 && shortSide <= 1000) || (touch && shortSide > 0 && shortSide <= 1200);
        if (!phone) return;
        document.documentElement.classList.add('is-phone');
        var meta = document.querySelector('meta[name="viewport"]');
        if (meta) meta.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover');
      })();
    </script>
